<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Translate Me</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
</head>
<body>
<header>
    <img src="./images/robot.png" alt="" id="robot">
   <div>
       <h1>Translate with me</h1>
       <p>Quick translations every time</p>
   </div>
</header>
<main>
    <section id="input-view">
        <h2>
            <label for="input">Type in any language, I'll detect it!</label>
        </h2>
        <textarea id="input"></textarea>
        <button id="translate-btn">Translate</button>
    </section>
    <section id="output-view" hidden>
        <h2>Original text (<span id="detected-language"></span>)</h2>
        <p id="original-text"></p>
        <h2>Your Translation</h2>
        <p id="translation-text"></p>
        <button id="start-over-btn">Start Over</button>
    </section>
</main>
<script src="config.js"></script>
<script src="index.js"></script>
</body>
</html>
